<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%" style="background-color: #FDFBF7; font-family: 'Comic Sans MS', 'Chalkboard SE', -apple-system, sans-serif;">
  <defs>
    <!-- Sketchy drop shadow -->
    <filter id="rough-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#2A2A2A" flood-opacity="0.15" />
    </filter>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF5722" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Title & Header (Style 1: Minimal Line Explainer Doodle) -->
  <rect x="25" y="20" width="850" height="60" rx="12" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="2.5" filter="url(#rough-shadow)" />
  <text x="45" y="58" font-size="22" font-weight="bold" fill="#2A2A2A">🎨 Hand-Drawn 2D Intuition: The 3 Core Secrets of RL</text>
  <text x="640" y="56" font-size="13" font-style="italic" fill="#78716C">Style: threerocks / minimal-line</text>

  <!-- PANEL 1: ADVANTAGE = JUMP HEIGHT ABOVE FLOOR -->
  <g transform="translate(25, 95)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="410" height="455" rx="16" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="2" filter="url(#rough-shadow)" />
    <!-- Panel Title -->
    <rect x="15" y="15" width="220" height="32" rx="6" fill="#FEF3C7" stroke="#2A2A2A" stroke-width="1.5" />
    <text x="25" y="37" font-size="14" font-weight="bold" fill="#92400E">1. Advantage (A = Q - V)</text>

    <!-- Subtitle explanation -->
    <text x="20" y="70" font-size="13" fill="#57534E">"Subtracting the floor so only pure skill counts"</text>

    <!-- The Raised Floor (State Value V) -->
    <line x1="30" y1="280" x2="380" y2="280" stroke="#78716C" stroke-width="4" stroke-dasharray="8 4" />
    <rect x="30" y="282" width="350" height="60" fill="#F5F5F4" opacity="0.8" />
    
    <!-- Floor Label: State Baseline V(State) -->
    <text x="40" y="305" font-size="14" font-weight="bold" fill="#44403C">State Baseline V(State) = 100 pts</text>
    <text x="40" y="325" font-size="11" fill="#78716C">"How good this room is in general"</text>

    <!-- Character / Bot standing on floor -->
    <g transform="translate(70, 210)">
      <!-- Head -->
      <circle cx="20" cy="20" r="14" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="2.5" />
      <!-- Eyes & Smile -->
      <circle cx="16" cy="18" r="2" fill="#2A2A2A" />
      <circle cx="24" cy="18" r="2" fill="#2A2A2A" />
      <path d="M 16 25 Q 20 28 24 25" stroke="#2A2A2A" stroke-width="2" fill="none" />
      <!-- Body & Limbs -->
      <line x1="20" y1="34" x2="20" y2="55" stroke="#2A2A2A" stroke-width="2.5" />
      <line x1="20" y1="42" x2="6" y2="38" stroke="#2A2A2A" stroke-width="2" />
      <line x1="20" y1="42" x2="34" y2="38" stroke="#2A2A2A" stroke-width="2" />
      <line x1="20" y1="55" x2="10" y2="70" stroke="#2A2A2A" stroke-width="2.5" />
      <line x1="20" y1="55" x2="30" y2="70" stroke="#2A2A2A" stroke-width="2.5" />
      <text x="-15" y="-5" font-size="11" font-weight="bold" fill="#2A2A2A">Your Bot</text>
    </g>

    <!-- Action 1: The Rocket Jump (Positive Advantage) -->
    <path d="M 120 250 Q 180 110 240 140" fill="none" stroke="#FF5722" stroke-width="3" stroke-dasharray="4 3" marker-end="url(#arrow)" />
    <!-- Character landing at high point -->
    <circle cx="245" cy="135" r="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="2" />
    <text x="240" y="140" font-size="12" font-weight="bold" fill="#EA580C">⭐</text>

    <!-- Brackets & Advantage Metric -->
    <line x1="270" y1="135" x2="270" y2="280" stroke="#FF5722" stroke-width="2.5" />
    <line x1="265" y1="135" x2="275" y2="135" stroke="#FF5722" stroke-width="2.5" />
    <line x1="265" y1="280" x2="275" y2="280" stroke="#FF5722" stroke-width="2.5" />
    
    <text x="280" y="195" font-size="13" font-weight="bold" fill="#EA580C">+Advantage = +50</text>
    <text x="280" y="215" font-size="11" fill="#78716C">Q(Move A) = 150</text>
    <text x="280" y="230" font-size="11" fill="#78716C">"True Edge: +50"</text>

    <!-- Action 2: The Trip / Blunder (Negative Advantage) -->
    <path d="M 100 270 Q 120 380 180 370" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3" />
    <text x="190" y="375" font-size="12" font-weight="bold" fill="#DC2626">💀 Action B: Q = 30 (Advantage = -70)</text>

    <!-- Bottom Lesson Callout -->
    <rect x="20" y="395" width="370" height="45" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
    <text x="30" y="415" font-size="12" font-weight="bold" fill="#166534">💡 Takeaway:</text>
    <text x="30" y="432" font-size="11" fill="#166534">Even if score is positive, if it falls below the floor, Advantage is negative!</text>
  </g>

  <!-- PANEL 2: TD ERROR & EXPECTATION vs MAX -->
  <g transform="translate(465, 95)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="410" height="455" rx="16" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="2" filter="url(#rough-shadow)" />
    
    <!-- SUB-PANEL 2A: TD ERROR (SURPRISE METER) -->
    <rect x="15" y="15" width="230" height="32" rx="6" fill="#DBEAFE" stroke="#2A2A2A" stroke-width="1.5" />
    <text x="25" y="37" font-size="14" font-weight="bold" fill="#1E40AF">2. TD Error = The "Surprise Meter"</text>

    <!-- Visual timeline -->
    <g transform="translate(20, 65)">
      <!-- Step t Guess Bubble -->
      <rect x="10" y="10" width="130" height="55" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
      <text x="20" y="32" font-size="12" font-weight="bold" fill="#1E3A8A">Step 1 Guess:</text>
      <text x="20" y="52" font-size="13" fill="#2563EB">"I expect 40 pts"</text>

      <!-- Arrow of Time -->
      <line x1="150" y1="37" x2="200" y2="37" stroke="#2A2A2A" stroke-width="2" marker-end="url(#arrow-blue)" />
      <text x="155" y="28" font-size="10" fill="#78716C">Take step</text>

      <!-- Step t+1 Reality -->
      <rect x="210" y="10" width="160" height="55" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" />
      <text x="220" y="30" font-size="11" font-weight="bold" fill="#991B1B">Instant Coin: +10</text>
      <text x="220" y="50" font-size="11" font-weight="bold" fill="#991B1B">Next Room Guess: +50</text>
      
      <!-- TD Error Feedback Arc -->
      <path d="M 290 75 Q 200 130 90 75" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="5 3" marker-end="url(#arrow)" />
      <text x="130" y="120" font-size="12" font-weight="bold" fill="#059669">Surprise = (10+50) - 40 = +20!</text>
      <text x="130" y="136" font-size="10" fill="#047857">"Update Step 1: Predict 60 next time!"</text>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="225" x2="390" y2="225" stroke="#E7E5E4" stroke-width="2" stroke-dasharray="4 4" />

    <!-- SUB-PANEL 2B: EXPECTATION vs MAX -->
    <rect x="15" y="240" width="220" height="32" rx="6" fill="#F3E8FF" stroke="#2A2A2A" stroke-width="1.5" />
    <text x="25" y="262" font-size="14" font-weight="bold" fill="#6B21A8">3. Expectation vs Max (ArgMax)</text>

    <!-- Visual of the 3-Way Fork -->
    <g transform="translate(20, 280)">
      <!-- Start dot -->
      <circle cx="30" cy="50" r="10" fill="#2A2A2A" />
      <text x="15" y="80" font-size="11" font-weight="bold" fill="#2A2A2A">State S</text>

      <!-- Fork branch 1 (Average) -->
      <path d="M 40 45 Q 100 20 180 20" fill="none" stroke="#9CA3AF" stroke-width="2" />
      <text x="190" y="25" font-size="12" fill="#6B7280">Move 1 (Score: 10)</text>

      <!-- Fork branch 2 (The Max / ArgMax Winner) -->
      <path d="M 40 50 L 180 50" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)" />
      <text x="190" y="55" font-size="13" font-weight="bold" fill="#7C3AED">Move 2 (Score: 90) ⭐ MAX</text>

      <!-- Fork branch 3 (Bad) -->
      <path d="M 40 55 Q 100 80 180 80" fill="none" stroke="#9CA3AF" stroke-width="2" />
      <text x="190" y="85" font-size="12" fill="#6B7280">Move 3 (Score: -20)</text>

      <!-- Expectation vs Max Summary box -->
      <rect x="10" y="105" width="350" height="55" rx="8" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.5" />
      <text x="20" y="125" font-size="11" fill="#581C87">🔹 <tspan font-weight="bold">Expectation (Average):</tspan> (10 + 90 - 20) / 3 = 26.6 (Mediocre)</text>
      <text x="20" y="145" font-size="11" fill="#581C87">🔥 <tspan font-weight="bold">Max / ArgMax (Greed):</tspan> Discards all, picks Move 2 = 90! (Optimal)</text>
    </g>
  </g>
</svg>